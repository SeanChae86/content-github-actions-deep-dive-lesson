name: Deploy Lambda Function
on: [push]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps: 
      - name: Check out code
        uses: actions/checkout@v4 # Updated to v4
      - name: Set up Python
        uses: actions/setup-python@v5 # Updated to v5
        with:
          python-version: '3.8'
      - name: Install libraries
        run: pip install flake8
      - name: Lint with flake8
        run: |
            cd function
            flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
            flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Check out code
        uses: actions/checkout@v4 # Updated to v4
      - name: Set up Python
        uses: actions/setup-python@v5 # Updated to v5
        with:
          python-version: '3.8'
      - name: Build Zip
        run: |
            cd function
            python -m pip install --upgrade pip
            if [ -f requirements.txt ]; then pip install -r requirements.txt -t .; fi 
            zip -r ../${{ github.sha }}.zip .
      - name: Archive artifact
        uses: actions/upload-artifact@v4 # Updated to v4 (Fixes your error)
        with:
          name: zipped-bundle
          path: ${{ github.sha }}.zip

  publish:
    runs-on: ubuntu-latest
    needs: build # Ensures the zip file actually exists first
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4 # STEP 1: Get the file from GitHub's storage
        with:
          name: zipped-bundle
      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2 # STEP 2: Create the page AND attach the file
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          name: Release ${{ github.run_number }}
          body: |
            Automated Release for commit ${{ github.sha }}
            This release contains the Lambda function source code and all required libraries.
          draft: false
          prerelease: false
          files: ${{ github.sha }}.zip # This looks for the file we just downloaded in Step 1
